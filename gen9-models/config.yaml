# Gen9's models, by alias. gen9-agent asks for an alias (`chat`, `embed`, …), never a vendor model,
# so what serves an alias can change here with no change in gen9-agent. After editing:
#   docker compose up -d --wait   (LiteLLM reads this file at start)
# Reference: https://docs.litellm.ai/docs/proxy/configs, providers: https://docs.litellm.ai/docs/providers
# Provider keys come from .env, named here as os.environ/<NAME>; they never leave this stack.

# How OpenRouter picks the provider behind each OpenRouter alias (sent as its `provider` object,
# https://openrouter.ai/docs/guides/routing/provider-selection): never one that trains on prompts.
# Otherwise OpenRouter's defaults: the cheaper providers first, Auto Exacto's ordering by
# tool-calling success for calls with tools, and the next provider when one fails. For zero data
# retention add `zdr: true` (GPT-6 Luna's ZDR endpoints are Azure's). Not `require_parameters: true`:
# no GPT-6 Luna endpoint lists `temperature` or `parallel_tool_calls`, so the call fails.
x-openrouter: &openrouter {data_collection: deny}

model_list:
  # The agent's model: reasoning, tools, images, long context. OpenAI's GPT-6 Luna through
  # OpenRouter, which serves most providers' models with one key. Another provider by its own key,
  # e.g.
  #   {model: openai/gpt-6-luna, api_key: os.environ/OPENAI_API_KEY}
  #   {model: openrouter/anthropic/claude-sonnet-5, api_key: os.environ/OPENROUTER_API_KEY, provider: *openrouter}
  # gen9-agent searches the web through the router (WEB_SEARCH=router): OpenAI's built-in search
  # needs OpenAI's own API.
  - model_name: chat
    litellm_params: {model: openrouter/openai/gpt-6-luna, api_key: os.environ/OPENROUTER_API_KEY, provider: *openrouter}
  # Used only when `chat` keeps failing (router_settings.fallbacks): another company's model
  # (DeepSeek-V4.1-Flash, MIT), served by other providers
  - model_name: chat-backup
    litellm_params: {model: openrouter/deepseek/deepseek-v4.1-flash, api_key: os.environ/OPENROUTER_API_KEY, provider: *openrouter}
  # Images and other media as input: inclusionAI's Ling 3.0 Flash VL, the cheapest that read every
  # test image right (README.md, "Why these"), served under data_collection: deny (Novita, DeepInfra).
  # Priced here: LiteLLM doesn't know this model, and without a price its calls cost $0 in each
  # person's budget ($0.021 and $0.062 a million tokens, OpenRouter)
  - model_name: vision
    litellm_params: {model: openrouter/inclusionai/ling-3.0-flash-vl, api_key: os.environ/OPENROUTER_API_KEY, provider: *openrouter, input_cost_per_token: 0.000000021, output_cost_per_token: 0.000000062}
  # Text embeddings. Qwen3-Embedding (Apache-2.0), shortened to 1024 dimensions (its Matryoshka
  # training keeps most of the quality; pgvector indexes at most 2000 as vector, 4000 as halfvec).
  # gen9-agent re-embeds its chats by itself when this changes; its search puts queries in this
  # model's form and keeps matches from its floor (gen9-agent api/search.py, QUERY_TEMPLATES and
  # SIMILARITY_FLOORS: another model is asked as typed, with no floor). Priced here ($0.01 per million
  # tokens): LiteLLM doesn't know this model's price, and without one the calls cost $0 in each
  # person's budget
  - model_name: embed
    litellm_params: {model: openrouter/qwen/qwen3-embedding-8b, api_key: os.environ/OPENROUTER_API_KEY, dimensions: 1024, provider: *openrouter, input_cost_per_token: 0.00000001}
    model_info: {mode: embedding}
  # Speech, transcription and image generation on OpenAI's own API. OpenRouter serves no OpenAI
  # speech model, and this LiteLLM version can't call its transcription or image APIs (README).
  # Each on OpenAI's cheapest current model: gpt-4o-mini-tts is the only
  # current speech model; gpt-4o-mini-transcribe is $0.003 a minute (gpt-transcribe $0.0045), by
  # its dated snapshot, since a project may be refused the undated name (403);
  # gpt-image-1-mini is $8 per million output tokens (gpt-image-2 and the 2.5 models $30)
  # Text to speech
  - model_name: speak
    litellm_params: {model: openai/gpt-4o-mini-tts, api_key: os.environ/OPENAI_API_KEY}
    model_info: {mode: audio_speech}
  # Speech to text (callers ask for response_format json: this model refuses verbose_json)
  - model_name: transcribe
    litellm_params: {model: openai/gpt-4o-mini-transcribe-2025-12-15, api_key: os.environ/OPENAI_API_KEY}
    model_info: {mode: audio_transcription}
  # Image generation
  - model_name: image
    litellm_params: {model: openai/gpt-image-1-mini, api_key: os.environ/OPENAI_API_KEY}
    model_info: {mode: image_generation}

  # Self-hosted, only with the `local` profile (README, "Self-hosted models"). To make an alias
  # local, point it here too, e.g. `embed` at ollama/embeddinggemma (768 dimensions; gen9-agent
  # re-embeds its chats by itself).
  - model_name: chat-local
    litellm_params: {model: ollama_chat/qwen3:0.6b, api_base: "http://ollama:11434"}
  - model_name: embed-local
    litellm_params: {model: ollama/embeddinggemma, api_base: "http://ollama:11434"}
    model_info: {mode: embedding}
  # Reranking search results (gen9-agent's SEARCH_RERANK), with the `local` profile: llama.cpp's
  # server answers the rerank API that LiteLLM's hosted_vllm provider sends. Hosted instead, e.g.
  # {model: cohere/rerank-v3.5, api_key: os.environ/COHERE_API_KEY}
  - model_name: rerank
    litellm_params: {model: hosted_vllm/jina-reranker-v1-turbo-en, api_base: "http://reranker:8080"}
    model_info: {mode: rerank}

  # More deployments of an alias share its traffic and stand in for each other. Examples:
  # - model_name: chat
  #   litellm_params: {model: anthropic/claude-sonnet-5, api_key: os.environ/ANTHROPIC_API_KEY}
  # - model_name: chat
  #   litellm_params: {model: gemini/gemini-3-pro, api_key: os.environ/GEMINI_API_KEY}
  # - model_name: chat
  #   litellm_params: {model: bedrock/anthropic.claude-sonnet-5, aws_region_name: us-east-1}
  # - model_name: chat
  #   litellm_params: {model: azure/<deployment>, api_base: os.environ/AZURE_API_BASE, api_key: os.environ/AZURE_API_KEY}
  # Self-hosted, OpenAI-compatible servers (vLLM, llama.cpp, TGI) or Ollama:
  # - model_name: chat
  #   litellm_params: {model: hosted_vllm/<model>, api_base: http://<host>:8000/v1}
  # - model_name: embed
  #   litellm_params: {model: ollama/nomic-embed-text, api_base: http://<host>:11434}

# Web search, by alias like the models: gen9-agent's web_search tool asks for `web`
# (POST /v1/search/web, Perplexity's Search API shape). Self-hosted SearXNG by default: free, but
# the engines it scrapes block bursts of searches. A hosted provider takes over by key, with
# SearXNG as its fallback when it fails, e.g.
#   - search_tool_name: web
#     litellm_params: {search_provider: brave, api_key: os.environ/BRAVE_API_KEY}   (or tavily, exa_ai, …)
#   - search_tool_name: web-searxng
#     litellm_params: {search_provider: searxng, api_base: "http://searxng:8080"}
# and in router_settings.fallbacks: {"web": ["web-searxng"]}. A provider's empty answer is not a
# failure, so it doesn't fall back.
search_tools:
  - search_tool_name: web
    litellm_params: {search_provider: searxng, api_base: "http://searxng:8080"}

router_settings:
  routing_strategy: simple-shuffle
  # Quick retries of a failing call inside the router; Temporal retries the whole turn only after
  # the router gives up (docs/temporal.md)
  num_retries: 2
  timeout: 600
  fallbacks: [{"chat": ["chat-backup"]}]

litellm_settings:
  # A parameter a provider doesn't take is dropped instead of failing the call
  drop_params: true
  # Every user's default budget and rate limit, kept in line with .env (GEN9_USER_BUDGET_USD, …) by
  # scripts/ensure-keys.py; a user gen9-agent calls on behalf of who has no budget of their own
  max_end_user_budget_id: gen9-user-default

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
