# The probe's OpenSandbox server (compose.yaml): Docker runtime, sandboxes on Docker's default bridge
# (a network policy needs it), the server's proxy through host-published ports
[server]
host = "0.0.0.0"
port = 8090

[proxy]
resolve_internal = false

[runtime]
type = "docker"
execd_image = "opensandbox/execd:v1.1.0"

[egress]
image = "opensandbox/egress:v1.1.7"
mode = "dns+nft"

[docker]
network_mode = "bridge"
host_ip = "host.docker.internal"
port_range_min = 41000
port_range_max = 41999

[ingress]
mode = "direct"
