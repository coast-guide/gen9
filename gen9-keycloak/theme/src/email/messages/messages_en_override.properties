# Gen9's words for the emails a person gets when how they sign in changes (docs/plans/manual-e2e.md,
# P6-C5). {0} says what changed (the event's template), {1} when, {2} from which address. NIST SP
# 800-63B-4: a notification gives clear instructions in case the person didn't do it.
eventUpdateCredentialSubject=Your Gen9 sign-in changed
eventUpdateCredentialBody={0} your Gen9 account on {1}, from the address {2}.\n\nIf it was you, there''s nothing to do. If it wasn''t, someone may be using your account: choose a new password with "Forgot password?" on Gen9''s sign-in page, remove anything you don''t recognise under Settings, Sign-in and security, and tell your Gen9 admin.
eventUpdateCredentialBodyHtml=<p><strong>Your sign-in changed</strong></p><p>{0} your Gen9 account on {1}, from the address {2}.</p><p>If it was you, there''s nothing to do. If it wasn''t, someone may be using your account: choose a new password with <em>Forgot password?</em> on Gen9''s sign-in page, remove anything you don''t recognise under <em>Settings</em>, <em>Sign-in and security</em>, and tell your Gen9 admin.</p>
