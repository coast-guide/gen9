# Gen9 under gen9.localhost on the k3d cluster deploy/k3d.yaml makes, over deploy/values.yaml:
#   K8S_VALUES="deploy/values.yaml deploy/k3d-domain.yaml" make k8s-up IMAGES=…
# Each service people reach gets an HTTPRoute on the Gateway deploy/k3d-gateway.yaml makes, with
# the hosts gen9-edge serves on Docker (docs/operations.md, "Kubernetes", "Try it on this machine").
# The settings files must carry the same domain: make setup DOMAIN=gen9.localhost first
global:
  domain: gen9.localhost
  gateway:
    name: gen9
    namespace: gen9-gateway
