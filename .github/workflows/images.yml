# Gen9's own images (docker-bake.hcl), built once for linux/amd64 and linux/arm64, each platform on
# a native runner, then run by digest by every deployment (docs/plans/deploy.md, U1). On a pull
# request they are only built; on main they are pushed to ghcr.io/coast-guide/<image>, tagged
# `main` and `sha-<commit>`, with BuildKit's signed SLSA provenance and an SBOM, then attested by
# GitHub (`gh attestation verify oci://ghcr.io/coast-guide/<image>@<digest> -R coast-guide/gen9`),
# and the digests written to a lock kept with the run. The build itself is Docker's reusable bake
# workflow, one call per image; it and every action are pinned to a commit (tag in the comment).
name: Images

on:
  pull_request:
    paths:
      - docker-bake.hcl
      - .github/workflows/images.yml
      - gen9-agent/**
      - gen9-ui/**
      - gen9-keycloak/**
      - gen9-postgres/**
      - gen9-sandbox/**
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        image: [gen9-agent, gen9-ui, gen9-keycloak, gen9-postgres, gen9-sandbox, gen9-sandbox-egress, gen9-sandbox-execd]
    uses: docker/github-builder/.github/workflows/bake.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    permissions:
      contents: read
      id-token: write # signs the provenance and the cache entries with the workflow's identity
      packages: write # pushes to GHCR
    with:
      target: ${{ matrix.image }}
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      sbom: true
      cache: true
      set-meta-labels: true
      set-meta-annotations: true
      meta-images: ghcr.io/coast-guide/${{ matrix.image }}
      meta-tags: |
        type=ref,event=branch
        type=sha,format=long
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

  attest:
    if: github.event_name != 'pull_request'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: [gen9-agent, gen9-ui, gen9-keycloak, gen9-postgres, gen9-sandbox, gen9-sandbox-egress, gen9-sandbox-execd]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # signs the attestation
      attestations: write # stores it with the repository
      packages: write # pushes it next to the image
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: the digest the build pushed
        id: digest
        env:
          IMAGE: ghcr.io/coast-guide/${{ matrix.image }}:sha-${{ github.sha }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ghcr.io/coast-guide/${{ matrix.image }}@$digest" > lock-line
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/coast-guide/${{ matrix.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lock-${{ matrix.image }}
          path: lock-line

  lock:
    if: github.event_name != 'pull_request'
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lock-*
      - name: images.lock, one line per image
        run: cat lock-*/lock-line | sort > images.lock && cat images.lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images.lock
          path: images.lock
