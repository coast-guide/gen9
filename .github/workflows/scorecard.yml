# OpenSSF Scorecard (docs/plans/deploy.md, R1 8): how Gen9's repository and releases measure
# against supply-chain practice, on main and weekly, into code scanning and Scorecard's public
# API (its badge). As ossf/scorecard's own workflow, under the rules publishing imposes: no
# workflow-level env or write permissions, id-token only on this job, only the approved actions
# in it. Each action pinned to a commit (tag in the comment).
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * 6" # Saturdays

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # the results into code scanning
      id-token: write # publishes the results, signed with the workflow's identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
