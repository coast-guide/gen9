# OpenSSF Scorecard (docs/plans/deploy.md, R1 8): how Gen9's repository and releases measure
# against supply-chain practice, on main and weekly, into code scanning and Scorecard's public
# API (its badge). As ossf/scorecard's own workflow, under the rules publishing imposes: no
# workflow-level env or write permissions, id-token only on this job, only the approved actions
# in it. Each action pinned to a commit (tag in the comment).
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * 6" # Saturdays

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # the results into code scanning
      id-token: write # publishes the results, signed with the workflow's identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
