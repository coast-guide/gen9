# What `make scan` reports and fails on (scripts/sbom.sh; docs/operations.md, "Images: SBOMs and
# known vulnerabilities"): the vulnerabilities that have a fix, failing on a High or Critical one.
# Those without a fix aren't listed: nothing can be done about them but follow the image's updates.
only-fixed: true
fail-on-severity: high
output: table

# Accepted findings, each with its reason. Each names the version it is accepted for, so the next
# version ends it.
ignore:
  # gosu 1.19, which the postgres images run once at start to drop root: built with Go 1.24.6,
  # whose standard library has 24 fixed advisories. gosu's SECURITY.md: no rebuild for a Go CVE
  # its code never reaches; check with govulncheck. govulncheck v1.8.0 -mode=binary on the
  # images' gosu (one binary, the same in all four) on 2026-10-01: "Your code is affected by 0
  # vulnerabilities" (docs/plans/manual-e2e.md, P6-D1).
  - package:
      name: stdlib
      version: go1.24.6
      location: /usr/local/bin/gosu
    reason: gosu 1.19 calls none of Go 1.24.6's vulnerable functions (govulncheck); gosu's SECURITY.md

  # MinIO's client, `mc`, which minio-lifecycle runs to set the raw events' expiry: x/crypto
  # v0.55.0 (SSH server code, GO-2026-6354, GO-2026-6355) and etcd's client v3.5.19
  # (GO-2026-6107). govulncheck v1.8.0 -mode=binary on this `mc` (2026-10-01): "Your code is
  # affected by 0 vulnerabilities". The server binary has newer ones of both.
  - package: {name: golang.org/x/crypto, version: v0.55.0, location: /usr/bin/mc}
    reason: MinIO's mc calls none of x/crypto v0.55.0's vulnerable functions (govulncheck)
  - package: {name: go.etcd.io/etcd/client/pkg/v3, version: v3.5.19, location: /usr/bin/mc}
    reason: MinIO's mc calls none of etcd's client v3.5.19's vulnerable functions (govulncheck)

  # Langfuse 4.48.0: deepmerge-ts 7.1.5 is Prisma 6.19.3's config loader's (@prisma/config), which
  # Langfuse runs at start to apply its migrations, merging its own settings. The advisory
  # (GHSA-ggr8-5vv4-36mx, stack exhaustion) needs two self-referencing objects merged: nothing
  # from outside reaches it. Langfuse's own code has 8.0.2.
  - vulnerability: GHSA-ggr8-5vv4-36mx
    package: {name: deepmerge-ts, version: 7.1.5}
    reason: only Prisma's config loader, on Langfuse's own settings, at start

  # LiteLLM v1.103.1: PyJWT 2.13.0. Its six advisories are about verifying with public keys or
  # JWKS (algorithm confusion, JWK handling, following redirects for a JWKS): LiteLLM's JWT auth
  # and SSO, neither of which Gen9's router configures (no enable_jwt_auth, no SSO settings, the
  # admin UI off: gen9-models/compose.yaml). LiteLLM's main has PyJWT 2.15.0 for its next release.
  - package: {name: pyjwt, version: 2.13.0}
    reason: LiteLLM's JWT auth and SSO, where PyJWT verifies with public keys or JWKS, are off in Gen9
  # Wolfi's glibc 2.44-r1 (CVE-2026-19499, in strfmon) and zlib 1.3.2-r5 (CVE-2026-85091, in the
  # non-blocking gzwrite path) in LiteLLM's image: Python's locale and gzip call neither. Fixed in
  # Wolfi; LiteLLM's next image brings them.
  - vulnerability: CVE-2026-19499
    package: {version: 2.44-r1}
    reason: strfmon, which nothing in LiteLLM's Python calls
  - vulnerability: CVE-2026-85091
    package: {name: zlib, version: 1.3.2-r5}
    reason: zlib's non-blocking gz* file writes, which Python's gzip doesn't use

  # OpenSandbox's server (gen9-sandbox, on python:3.10-slim). setuptools vendors jaraco.context
  # 5.3.0 and wheel 0.45.1 to build packages; their advisories are in jaraco.context.tarball() and
  # `wheel unpack`, which the server never runs.
  - package: {name: jaraco-context, version: 5.3.0, location: "**/setuptools/_vendor/**"}
    reason: setuptools' own copy, for building packages, which the server never does
  - package: {name: wheel, version: 0.45.1, location: "**/setuptools/_vendor/**"}
    reason: setuptools' own copy, for building packages, which the server never does
  # Its Python 3.10.21: CVE-2026-7210 (Expat's hash-flooding salt, for XML it parses) and
  # CVE-2026-82049 (tarfile's extraction filters). The server parses no XML and extracts no archive
  # to disk: it writes archives, and reads two files from the pinned execd image's with
  # extractfile (release-1.1.0's services/docker). Both are fixed in 3.10.22, tagged, the last 3.10.
  - vulnerability: CVE-2026-7210
    package: {name: python, version: 3.10.21}
    reason: OpenSandbox's server parses no XML
  - vulnerability: CVE-2026-82049
    package: {name: python, version: 3.10.21}
    reason: OpenSandbox's server extracts no archive to disk

  # Gen9's egress (gen9-sandbox/egress): mitmproxy 12.2.3 caps these below their fixes. Its sidecar
  # runs mitmdump, which reaches none of them (mitmproxy's own code, 2026-10-01): tornado is
  # imported only by mitmproxy's console and web UIs; msgpack by none of its code; mitmproxy
  # verifies upstream certificates through pyOpenSSL and OpenSSL, not cryptography's X.509
  # verifier, and decrypts no PKCS#7. Held to the image's own Python path.
  - package: {name: tornado, version: 6.5.5, location: "/usr/local/lib/python3.13/dist-packages/**"}
    reason: only mitmproxy's console and web UIs use tornado; egress runs mitmdump
  - package: {name: msgpack, version: 1.1.2, location: "/usr/local/lib/python3.13/dist-packages/**"}
    reason: mitmproxy 12.2.3's code doesn't use msgpack
  - vulnerability: GHSA-g6cj-pr64-35w5
    package: {name: cryptography, version: 48.0.1, location: "/usr/local/lib/python3.13/dist-packages/**"}
    reason: PKCS#7 EnvelopedData decryption, which mitmproxy never does
  - vulnerability: GHSA-jwv3-5hgf-82ww
    package: {name: cryptography, version: 48.0.1, location: "/usr/local/lib/python3.13/dist-packages/**"}
    reason: cryptography's X.509 path building; mitmproxy verifies through OpenSSL
