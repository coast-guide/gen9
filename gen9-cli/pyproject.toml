[project]
name = "gen9-cli"
version = "0.1.0"
description = "Gen9 from the terminal: sign in with the OAuth 2.0 Device Authorization Grant, ask the agent"
readme = "README.md"
authors = [
    { name = "SK SAHIL" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
gen9 = "gen9_cli.main:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.ruff.lint]
# Defaults (E4, E7, E9, F) + import sorting, pyupgrade, bugbear, and flake8-async: nothing blocks
# the event loop (AGENTS.md, "Python is async from the ground up")
extend-select = ["I", "UP", "B", "ASYNC"]

[tool.uv]
# A dependency cooldown: uv lock and uv add choose versions published at least 7 days before, so a
# malicious release has had time to be found and pulled before it can come in. uv writes the cutoff
# into uv.lock and moves it only on a new resolution (docs/development.md, "Dependencies").
exclude-newer = "7 days"
